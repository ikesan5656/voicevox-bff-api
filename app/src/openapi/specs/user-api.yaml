openapi: 3.0.0
info:
  title: Sample API
  description: 説明文
  version: 1.0.0
paths:
  /users:
    get:
      tags:
        - users
      summary: Get all users.
      description: Returns a single User model
      parameters: []
      responses:
        '200':
          description: A JSON array of User model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas'
components:
  schemas:
    User:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
